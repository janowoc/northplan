[project]
name = "northplan"
version = "0.0.0"
description = "Canadian household financial planning engine: deterministic simulator, Monte Carlo, policy optimizer"
readme = "README.md"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "Jan Owoc" }]
requires-python = ">=3.12"

dependencies = [
    "numpy>=2.0",
    "pyyaml>=6.0",
    "pydantic>=2.7",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff==0.16.4",
]

[project.scripts]
northplan = "cli.main:main"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = [
    "engine",
    "engine.params",
    "engine.scenario",
    "engine.tax",
    "engine.benefits",
    "engine.accounts",
    "engine.core",
    "engine.mc",
    "engine.policy",
    "engine.optimize",
    "api",
    "cli",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = [
    "--strict-markers",
    "--strict-config",
    "-ra",
]
markers = [
    "golden: expected values supplied by the human in tests/golden/cases. Never edit one to make a test pass.",
    "characterization: behaviour snapshot. Regenerate only on explicit human instruction.",
]
filterwarnings = ["error"]
# A parametrization that collects nothing is skipped by default, so a suite
# whose cases come from files on disk reports green when it finds no files.
# Both the provenance tests and the golden harness are shaped that way; make
# the empty collection a failure instead.
empty_parameter_set_mark = "fail_at_collect"

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["web"]
force-exclude = true

[tool.ruff.format]
# ruff also formats Python blocks inside Markdown. The formatter is kept to
# .py files so that `ruff format .` never rewrites params/taxes_benefits.md,
# which only the human edits.
exclude = ["*.md"]

[tool.ruff.lint]
# `explicit-preview-rules` is load-bearing, not cosmetic. Bare `preview = true`
# also changes the behaviour of the `E`/`W`/`F`/`B`/`UP`/`N`/`SIM`/`RUF`/`NPY`/
# `ARG`/`PTH` selections below and would land unrelated diagnostics here. With
# it, the only preview rule in effect is the one named in `select`, CPY001, and
# nothing else changes.
preview = true
explicit-preview-rules = true
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "UP",   # pyupgrade
    "N",    # pep8-naming
    "SIM",  # flake8-simplify
    "RUF",  # ruff-specific
    "NPY",  # numpy-specific
    "ARG",  # unused arguments
    "PTH",  # use pathlib
    "CPY001",  # missing copyright notice (preview; see the two flags above)
]
ignore = [
    # Stub bodies raise NotImplementedError, so their arguments are unused by
    # construction. Removed by roadmap issue 23, "Command line", whose success
    # criterion is that the example runs end to end without it.
    "ARG001",
]

[tool.ruff.lint.flake8-copyright]
# CPY001 covers Python only, and reads just the first 4096 bytes of a file.
#
# It also checks neither the copyright holder nor the licence: ruff has no
# option for either, so this pattern matches any SPDX-FileCopyrightText line
# with a year on it. A .py file headed `2026 Somebody Else` /
# `SPDX-License-Identifier: MIT` passes `ruff check` clean — verified. That
# matters because `ruff check .` is what a pre-commit hook and a hurried
# reader run. tests/test_licence_headers.py is the binding constraint on the
# holder, the licence, and every non-Python file, and it pins both.
notice-rgx = "(?i)SPDX-FileCopyrightText:\\s*\\d{4}"

[tool.ruff.lint.per-file-ignores]
# Tests may assert on private helpers and use long literal tables.
"tests/**" = ["E501"]
# Embedded CSS and HTML templates.
"docs/roadmap_page.py" = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["engine", "api", "cli"]
