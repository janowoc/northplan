# Runs for a pull request, a push to main and a v* tag. A push to any other
# branch runs nothing of its own: the branch is tested only by a pull request
# opened from it, which tests the branch merged with its base and runs nothing
# while the two conflict. Every run tests and, once the tests pass, builds the
# image for amd64 and arm64; only main and v* tags publish it to ghcr.io. A push
# to main also builds the browser page and deploys it to GitHub Pages once the
# tests pass; pull requests deploy nothing. Uses GITHUB_TOKEN and no other
# secret. Every action is pinned to a commit; the comment names its release. The
# QEMU image, buildx and BuildKit are pinned too. docs/maintenance.md says how
# each pin is updated.

name: docker-image

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # A newer push cancels a run in progress only on a pull request. GitHub
  # still replaces a run waiting in the group, so the newest push always gets
  # a run, and a push whose run was replaced publishes no image.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.13.0"
          enable-cache: false
      # The Python version is the one in .python-version, the base image's
      # patch.
      - run: uv sync --locked --extra dev
      - run: echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.21.0"
          package-manager-cache: false
      - run: npm ci --ignore-scripts
        working-directory: tests/browser
      - name: The tag is v followed by the version in pyproject.toml
        if: startsWith(github.ref, 'refs/tags/')
        env:
          TAG: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import os, re, sys, tomllib
          tag = os.environ["TAG"]
          with open("pyproject.toml", "rb") as f:
              version = tomllib.load(f)["project"]["version"]
          if not re.fullmatch(r"v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)", tag):
              sys.exit(f"tag {tag!r} is not vN.N.N")
          if tag != f"v{version}":
              sys.exit(f"tag {tag!r} does not match {version!r}, the version in pyproject.toml")
          PY
      - run: ruff check .
      - run: pytest
        env:
          NORTHPLAN_REQUIRE_NODE: "1"

  pages:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: python3 browser/build.py "$RUNNER_TEMP/site"
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ${{ runner.temp }}/site
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  image:
    needs: test
    if: >-
      github.event_name == 'pull_request'
      || github.ref == 'refs/heads/main'
      || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.13.0"
          enable-cache: false
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          image: docker.io/tonistiigi/binfmt:qemu-v10.2.3@sha256:400a4873b838d1b89194d982c45e5fb3cda4593fbfd7e08a02e76b03b21166f0
          platforms: arm64
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          version: v0.37.2
          driver-opts: image=moby/buildkit:v0.33.1@sha256:cec9f139f45e93c5c69c60f8b07cfad9f43f4ef6b6a6cd917527fea5ff2e3dea
      - name: Build amd64 for the smoke test
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: northplan:smoke-amd64
          cache-from: type=gha,scope=amd64
          cache-to: type=gha,mode=max,scope=amd64
      - name: Build arm64 for the smoke test
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/arm64
          load: true
          tags: northplan:smoke-arm64
          cache-from: type=gha,scope=arm64
          cache-to: type=gha,mode=max,scope=arm64
      # From /, so that the import and the parameters resolve through the
      # install rather than the working directory. Each image must hold the
      # runtime packages in uv.lock and, besides the base image's pip, nothing
      # else. The lock's environment markers are dropped, so a dependency it
      # holds only for another platform makes this step fail.
      - name: Smoke test, each image runs the example, holds the minimal scenario and the locked packages
        run: |
          set -euo pipefail
          norm() { sed 's/ *;.*//' | awk -F'==' 'NF==0 {next} NF!=2 {print "cannot read: " $0 > "/dev/stderr"; exit 1} {n=tolower($1); gsub(/[-_.]+/,"-",n); print n"=="$2}' | sort; }
          uv export --locked --no-dev --no-hashes --no-emit-project --no-header --no-annotate --quiet | norm > "$RUNNER_TEMP/locked.txt"
          test -s "$RUNNER_TEMP/locked.txt"
          for arch in amd64 arm64; do
            docker run --rm --platform "linux/$arch" "northplan:smoke-$arch" sh -c \
              'cd / && python -c "import api.main" && test -s /app/scenarios/minimal.yaml && northplan simulate /app/scenarios/example.yaml --paths 10 --out /tmp/smoke.csv'
            docker run --rm --platform "linux/$arch" "northplan:smoke-$arch" pip freeze --all --exclude-editable | grep -v '^pip==' | norm > "$RUNNER_TEMP/frozen-$arch.txt"
            diff "$RUNNER_TEMP/locked.txt" "$RUNNER_TEMP/frozen-$arch.txt"
          done
      # The default command, as a container runs it: a client through a published
      # port needs the token, a token that was set is not logged, and without one
      # the server logs the one it generated.
      - name: Smoke test, each image serves its default command behind the token
        run: |
          set -euo pipefail
          token=synthetic-smoke-token-0123
          for arch in amd64 arm64; do
            cid=$(docker run -d --platform "linux/$arch" -p 127.0.0.1:18000:8000 -e NORTHPLAN_TOKEN="$token" "northplan:smoke-$arch")
            code=000
            for _ in $(seq 120); do
              code=$(curl -s --max-time 5 -o /dev/null -w '%{http_code}' -u ":$token" http://127.0.0.1:18000/health || true)
              [ "$code" != 000 ] && break
              sleep 1
            done
            logs=$(docker logs "$cid" 2>&1)
            test "$code" = 200 || { echo "$logs"; echo "$arch: with the token, $code, not 200" >&2; exit 1; }
            code=$(curl -s --max-time 5 -o /dev/null -w '%{http_code}' http://127.0.0.1:18000/health || true)
            test "$code" = 401 || { echo "$arch: without the token, $code, not 401" >&2; exit 1; }
            if grep -qF "$token" <<< "$logs"; then echo "$arch: the token that was set is in the log" >&2; exit 1; fi
            docker rm -f "$cid" > /dev/null
            cid=$(docker run -d --platform "linux/$arch" "northplan:smoke-$arch")
            logs=
            for _ in $(seq 120); do
              logs=$(docker logs "$cid" 2>&1)
              grep -q "Uvicorn running" <<< "$logs" && break
              sleep 1
            done
            grep -qE "^northplan-serve: NORTHPLAN_TOKEN is not set; this run's token, new on every start, is [0-9a-f]{32}$" <<< "$logs" || { echo "$logs"; echo "$arch: no generated token in the log" >&2; exit 1; }
            docker rm -f "$cid" > /dev/null
          done
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # latest follows the most recently published v* release (the action's
      # default for semver tags, which compares no versions); main publishes as
      # main and sha-<short>.
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch,enable={{is_default_branch}}
            type=sha,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
          # GitHub detects the licence as AGPL-3.0; the project is
          # AGPL-3.0-or-later.
          labels: |
            org.opencontainers.image.licenses=AGPL-3.0-or-later
      # Normally a rebuild from the smoke builds' cache; on a cache miss, a fresh
      # build from the same lock and base image that was not smoke-tested.
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: |
            type=gha,scope=amd64
            type=gha,scope=arm64
