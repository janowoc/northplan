# Tests every branch push, v* tag and pull request. Builds the image for amd64
# and arm64 on pull requests, pushes to main and v* tags, and publishes it to
# ghcr.io only from main and v* tags, after the tests pass. Uses GITHUB_TOKEN
# and no other secret. Every action is pinned to a commit; the comment names
# its release. The QEMU image, buildx and BuildKit are pinned too.
# docs/maintenance.md says how each pin is updated.

name: docker-image

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # A newer push cancels a run in progress only on a pull request. GitHub
  # still replaces a run waiting in the group, so the newest push always gets
  # a run, and a push whose run was replaced publishes no image.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.23"
          enable-cache: false
      # The Python version is the one in .python-version, the base image's
      # patch.
      - run: uv sync --locked --extra dev
      - run: echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
      - name: The tag is v followed by the version in pyproject.toml
        if: startsWith(github.ref, 'refs/tags/')
        env:
          TAG: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import os, re, sys, tomllib
          tag = os.environ["TAG"]
          with open("pyproject.toml", "rb") as f:
              version = tomllib.load(f)["project"]["version"]
          if not re.fullmatch(r"v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)", tag):
              sys.exit(f"tag {tag!r} is not vN.N.N")
          if tag != f"v{version}":
              sys.exit(f"tag {tag!r} does not match {version!r}, the version in pyproject.toml")
          PY
      - run: ruff check .
      - run: pytest

  image:
    needs: test
    if: >-
      github.event_name == 'pull_request'
      || github.ref == 'refs/heads/main'
      || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.23"
          enable-cache: false
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          image: docker.io/tonistiigi/binfmt:qemu-v10.2.3@sha256:400a4873b838d1b89194d982c45e5fb3cda4593fbfd7e08a02e76b03b21166f0
          platforms: arm64
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          version: v0.37.2
          driver-opts: image=moby/buildkit:v0.33.1@sha256:cec9f139f45e93c5c69c60f8b07cfad9f43f4ef6b6a6cd917527fea5ff2e3dea
      - name: Build amd64 for the smoke test
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: northplan:smoke-amd64
          cache-from: type=gha,scope=amd64
          cache-to: type=gha,mode=max,scope=amd64
      - name: Build arm64 for the smoke test
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/arm64
          load: true
          tags: northplan:smoke-arm64
          cache-from: type=gha,scope=arm64
          cache-to: type=gha,mode=max,scope=arm64
      # From /, so that the import and the parameters resolve through the
      # install rather than the working directory. Each image must hold the
      # runtime packages in uv.lock and, besides the base image's pip, nothing
      # else. The lock's environment markers are dropped, so a dependency it
      # holds only for another platform makes this step fail.
      - name: Smoke test, each image runs the example and holds the locked packages
        run: |
          set -euo pipefail
          norm() { sed 's/ *;.*//' | awk -F'==' 'NF==0 {next} NF!=2 {print "cannot read: " $0 > "/dev/stderr"; exit 1} {n=tolower($1); gsub(/[-_.]+/,"-",n); print n"=="$2}' | sort; }
          uv export --locked --no-dev --no-hashes --no-emit-project --no-header --no-annotate --quiet | norm > "$RUNNER_TEMP/locked.txt"
          test -s "$RUNNER_TEMP/locked.txt"
          for arch in amd64 arm64; do
            docker run --rm --platform "linux/$arch" "northplan:smoke-$arch" sh -c \
              'cd / && python -c "import api.main" && northplan simulate /app/scenarios/example.yaml --paths 10 --out /tmp/smoke.csv'
            docker run --rm --platform "linux/$arch" "northplan:smoke-$arch" pip freeze --all --exclude-editable | grep -v '^pip==' | norm > "$RUNNER_TEMP/frozen-$arch.txt"
            diff "$RUNNER_TEMP/locked.txt" "$RUNNER_TEMP/frozen-$arch.txt"
          done
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # latest follows the most recently published v* release (the action's
      # default for semver tags, which compares no versions); main publishes as
      # main and sha-<short>.
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch,enable={{is_default_branch}}
            type=sha,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
          # GitHub detects the licence as AGPL-3.0; the project is
          # AGPL-3.0-or-later.
          labels: |
            org.opencontainers.image.licenses=AGPL-3.0-or-later
      # Normally a rebuild from the smoke builds' cache; on a cache miss, a fresh
      # build from the same lock and base image that was not smoke-tested.
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: |
            type=gha,scope=amd64
            type=gha,scope=arm64
