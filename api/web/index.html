<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>northplan</title>
  <!-- No build step, no npm, no bundler. Two CDN scripts, editor.js and this file. -->
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.1/dist/cdn.min.js"></script>
  <script src="https://cdn.plot.ly/plotly-2.35.2.min.js" charset="utf-8"></script>
  <script src="editor.js"></script>
  <style>
    :root { color-scheme: light dark; }
    body {
      font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
      max-width: 60rem; margin: 0 auto; padding: 2rem 1.25rem; line-height: 1.55;
    }
    h1 { margin-bottom: 0.25rem; }
    .sub { opacity: 0.7; margin-top: 0; }
    .status { padding: 0.75rem 1rem; border-left: 3px solid currentColor; opacity: 0.85; }
    #scenario {
      width: 100%; box-sizing: border-box; margin-top: 1rem; padding: 0.5rem;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 0.85rem;
    }
    button { margin-top: 0.5rem; padding: 0.4rem 1.2rem; font-size: 1rem; }
    .error { margin-top: 1rem; padding: 0.75rem 1rem; border-left: 3px solid #c0392b; }
    .error pre { white-space: pre-wrap; margin: 0.25rem 0 0; font-family: inherit; }
    #chart { height: 24rem; margin-top: 1.5rem; }
    .caption { opacity: 0.7; font-size: 0.85rem; }
    .summary p { margin: 0.25rem 0; }
    [x-cloak] { display: none !important; }
    code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
  </style>
</head>
<body x-data="northplan()" x-init="checkHealth()">

  <h1>northplan</h1>
  <p class="sub">Canadian household financial planning engine</p>

  <div class="status">
    <p>
      API: <strong x-text="health"></strong>
    </p>
  </div>

  <!-- editor -->
  <div class="editor-bar">
    <button type="button" x-show="!formOpen" :disabled="formBusy || !ready" @click="openForm()">Edit in form</button>
    <button type="button" x-show="!formOpen" :disabled="formBusy || !ready" @click="openFile('minimal')">New scenario</button>
    <button type="button" x-show="!formOpen" :disabled="formBusy || !ready" @click="openFile('example')">Open example</button>
    <button type="button" x-show="formOpen" x-cloak :disabled="formBusy || formYaml === null" @click="useYaml()">Back to YAML</button>
    <button type="button" x-show="formOpen" x-cloak :disabled="formBusy || formYaml === null" @click="downloadYaml()">Download YAML</button>
    <button type="button" x-show="formOpen" x-cloak :disabled="formBusy" @click="discardForm()">Discard form</button>
  </div>
  <p class="editor-state" x-show="formOpen || formBusy" x-cloak x-text="formStateText()"></p>
  <div class="editor-problem" x-show="formProblem" x-cloak>
    <p x-text="formProblem"></p>
    <ul><template x-for="place in formReferences"><li x-text="place"></li></template></ul>
  </div>
  <ul class="editor-notices" x-show="formNotices.length" x-cloak>
    <template x-for="notice in formNotices"><li x-text="notice"></li></template>
  </ul>
  <div class="editor-errors" x-show="formErrors.length" x-cloak>
    <p x-show="!formOpen">The form cannot open this text:</p>
    <ul><template x-for="line in formErrors"><li x-text="line"></li></template></ul>
  </div>
  <fieldset id="form" x-ref="form" x-show="formOpen" x-cloak :disabled="formBusy"></fieldset>
  <!-- /editor -->

  <textarea id="scenario" rows="24" spellcheck="false" x-model="scenario" x-show="!formOpen"></textarea>
  <button type="button" id="run" :disabled="running || !ready || (formOpen && formYaml === null)" @click="run()" x-text="running ? 'Running…' : 'Run'">Run</button>

  <div class="error" x-show="error" x-cloak>
    <strong x-text="'Error ' + (error && error.status) + ':'"></strong>
    <pre x-text="error && error.message"></pre>
  </div>

  <div id="chart"></div>
  <p class="caption" x-show="summary" x-text="summary && summary.statistics"></p>

  <div class="summary" x-show="summary" x-cloak>
    <p x-text="summary && summary.estate"></p>
    <p x-text="summary && summary.depletion"></p>
    <p x-text="summary && summary.run"></p>
  </div>

  <script>
    function northplan() {
      const editor = northplanEditor({
        async call(name, argumentsText) {
          let r;
          let text;
          try {
            r = await fetch(`/api/editor/${name}`, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: argumentsText,
            });
            text = await r.text();
          } catch (e) {
            return { status: 'network', body: String(e) };
          }
          let body;
          try {
            body = NorthplanJson.parse(text);
          } catch (e) {
            body = text;
          }
          return { status: r.status, body };
        },
        async file(name) {
          const r = await fetch(`/api/${name}`);
          const text = await r.text();
          if (!r.ok) {
            let message = text;
            try {
              const detail = JSON.parse(text).detail;
              if (typeof detail === 'string') {
                message = detail;
              }
            } catch (e) {
              message = text;
            }
            throw new Error(`/api/${name}: ${r.status} ${message}`);
          }
          return text;
        },
      });
      return {
        health: 'checking…',
        scenario: '',
        running: false,
        error: null,
        summary: null,
        ready: true,
        ...editor,
        async init() {
          this.error = null;
          try {
            const r = await fetch('/api/example');
            if (r.ok) {
              this.scenario = await r.text();
            } else {
              this.error = await this.describe(r);
            }
          } catch (e) {
            this.error = { status: 'network', message: String(e) };
          }
        },
        async checkHealth() {
          try {
            const r = await fetch('/health');
            this.health = r.ok ? (await r.json()).status : `error ${r.status}`;
          } catch (e) {
            this.health = 'unreachable';
          }
        },
        async describe(response) {
          let text;
          try {
            text = await response.text();
          } catch (e) {
            return { status: 'network', message: String(e) };
          }
          let message = text;
          try {
            const detail = JSON.parse(text).detail;
            message = typeof detail === 'string' ? detail : JSON.stringify(detail, null, 2);
          } catch (e) {
            message = text;
          }
          return { status: response.status, message };
        },
        clear() {
          this.error = null;
          this.summary = null;
          Plotly.purge('chart');
        },
        async run() {
          const text = this.formOpen ? this.formYaml : this.scenario;
          if (text === null) {
            return;
          }
          this.running = true;
          try {
            this.clear();
            let r;
            try {
              r = await fetch('/api/simulate', {
                method: 'POST',
                headers: { 'Content-Type': 'application/yaml' },
                body: text,
              });
            } catch (e) {
              this.error = { status: 'network', message: String(e) };
              return;
            }
            if (!r.ok) {
              this.error = await this.describe(r);
              return;
            }
            this.show(await r.json());
          } catch (e) {
            this.error = { status: 'client', message: String(e) };
          } finally {
            this.running = false;
          }
        },
        show(doc) {
          const x = doc.years.map((row) => row.year);
          const column = (name) => doc.years.map((row) => row[name]);
          const traces = [
            {
              x, y: column('after_tax_net_worth_p10'), name: '10th percentile',
              mode: 'lines', line: { width: 0 }, connectgaps: false,
            },
            {
              x, y: column('after_tax_net_worth_p90'), name: '90th percentile',
              mode: 'lines', line: { width: 0 }, fill: 'tonexty',
              fillcolor: 'rgba(31, 119, 180, 0.25)', connectgaps: false,
            },
            {
              x, y: column('after_tax_net_worth_p50'), name: 'Median',
              mode: 'lines', line: { width: 2 }, connectgaps: false,
            },
          ];
          const layout = {
            paper_bgcolor: 'rgba(0,0,0,0)',
            plot_bgcolor: 'rgba(0,0,0,0)',
            font: { color: getComputedStyle(document.body).color },
            xaxis: { title: { text: 'Year' } },
            yaxis: { title: { text: doc.meta.dollars } },
          };
          Plotly.newPlot('chart', traces, layout, { responsive: true });
          const grouped = new Intl.NumberFormat('en-CA', { maximumFractionDigits: 0 });
          const last = doc.years[doc.years.length - 1];
          const estate = grouped.format(Math.round(doc.final.estate_after_tax_p50));
          const depletion = (last.depletion_probability * 100).toFixed(1);
          this.summary = {
            statistics: doc.meta.statistics,
            estate: `Median after-tax estate: $${estate} (${doc.meta.estate_dollars})`,
            depletion: `Depletion probability: ${depletion}% — the share of paths that run out of money at some point before the second death.`,
            run: `Policy ${doc.meta.policy} · ${grouped.format(doc.meta.paths)} paths · seed ${doc.meta.seed}`,
          };
        },
      };
    }
  </script>

</body>
</html>
