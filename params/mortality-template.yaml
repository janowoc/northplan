# Mortality: annual probability of death q(x) by sex — tax year XXXX
#
# ============================================================================
#  PLACEHOLDER FILE. EVERY NUMBER BELOW IS FAKE, DELIBERATELY.
#
#  This shows the SHAPE the real params/YYYY/mortality.yaml should take. No
#  value in it was checked against a source and none may be copied into a year
#  directory as-is.
#
#  Values are repdigits (0.11111) so that a real number stands out at a
#  glance. Every unverified line ends in `# PLACEHOLDER`. Replace the number and
#  the marker together, then `grep -c PLACEHOLDER mortality.yaml` is the work
#  remaining — less this banner, which mentions the marker three times while
#  describing it, and which you delete along with the last one.
#
#  THE TWO TABLES USE DIFFERENT REPDIGITS: 0.11111 for f, 0.22222 for m. Not
#  decoration. The likeliest way to get this file wrong is to filter the source
#  to one sex, paste the column, and forget to re-filter before pasting the
#  other — every value is then a real published q(x), and half of them belong
#  to the wrong person. A structural test asserts the two tables are not
#  identical, and it can only do that if the template does not ship them
#  identical.
# ============================================================================
#
# SOURCE OF RECORD for every value below:
#   Statistics Canada Table 13-10-0114-01, "Life expectancy and other elements
#   of the complete life table, three-year estimates, Canada, all provinces
#   except Prince Edward Island", element "Death probability between age x and
#   x+1", by sex.
#
#   RECORD THE GEOGRAPHY AND THE REFERENCE PERIOD in the dated source comment
#   below. The table publishes several of each — write down whether these rows
#   are Alberta or Canada, and which three-year period they cover. Neither is
#   recoverable from the numbers once they are in the file.
#
#   It is a PERIOD table: it carries no mortality improvement, so a 40-year-old
#   in the run meets today's 80-year-old mortality on reaching 80
#   (docs/limitations.md L8).
#
# The engine derives a monthly hazard assuming a constant force of mortality
# within each year of age:
#
#     q_month = 1 - (1 - q_x) ** (1/12)
#
# That is a modelling choice rather than anything the source states, and it is
# written down both here and in engine/core/mortality.py (L9).
#
# Every path dies by terminal_age_years, where q is 1 by construction. The
# simulation runs each path to the second death and has no separate horizon
# (L10).
#
# ---------------------------------------------------------------------------
# THIS TABLE IS NOT MONOTONIC IN AGE. NO TEST MAY ASSUME IT IS.
#
# Infant mortality exceeds childhood mortality: a real q(x) FALLS from age 0 to
# roughly age 10 and only rises after that. tests/params/
# test_param_file_structure.py asserts that the RRIF and LIF factor tables
# never decrease with age, and a reader arriving here will be tempted to point
# that same assertion at these rows. It would reject the true table. The
# omission from MORTALITY_CHECKS is deliberate. Do not add it.
# ---------------------------------------------------------------------------
#
# Conventions for the file you create from this template:
#   - Probabilities are bare fractions (0.01111), never percentages or per
#     mille.
#   - One row per age, no gaps, 0 through terminal_age_years, in both tables.
#   - The two tables are keyed f and m, the two the source publishes.
#   - IF THE SOURCE PUBLISHES 0.000000 FOR AN AGE, STOP AND RAISE IT. The
#     structural test bounds q to (0, 1] and will reject the file. Do not
#     substitute a small value to get past it: a zero is either a suppressed
#     cell or a genuine no-deaths-observed cell in a three-year provincial
#     table, and which one it is decides what belongs here. That is a
#     modelling decision and it gets made deliberately, not in passing.
#
# Read by: engine/core/mortality.py
#
# YYYY-MM-DD https://www150.statcan.gc.ca/t1/tbl1/en/tv.action?pid=1310011401   # PLACEHOLDER
