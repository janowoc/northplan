# Old Age Security and Guaranteed Income Supplement — tax year 2026
#
# Conventions for this file:
#   - Every group of values carries a source comment directly above it: the
#     primary source URL and the date a human checked it against that source.
#     Individual values add their own note where the group comment is not
#     specific enough — a line number on a form, a subsection of an Act.
#     These comments ARE the audit record; there is no separate ledger.
#   - Say the period in the key name. OAS and GIS maxima are published MONTHLY;
#     the recovery tax threshold is published ANNUALLY. Write each as published
#     and let the engine convert once. Never convert here.
#   - Dollar amounts end in _annual, _monthly, _lifetime, or _each.
#   - Rates are bare fractions (0.15), never percentages or basis points.
#   - Nominal amounts as published; the engine deflates. Do not pre-deflate.
#
# Read by: engine/benefits/oas.py, engine/benefits/gis.py,
#          engine/tax/combined.py::oas_repayment (recovery_tax)
#
# Ages are in MONTHS — the deferral increment is per month, and the age band
# step-up happens in the month the threshold is reached.

# --- Benefit year -----------------------------------------------------------
# Read by no module today. The OAS repayment does NOT use this block: it is a
# line on the current year's return, assessed once at the December close on
# that year's net income — which includes the OAS received in the same year —
# and capped at that OAS (L23). OAS is paid gross every month.
#
# The block is here for a future GIS implementation, which genuinely is
# assessed over a July-to-June benefit period against an earlier year's
# income: a period beginning in start_month of year Y is assessed against net
# income from year Y + income_year_offset, so the governing income year
# changes partway through a calendar year. Until GIS is modelled (L2) these
# keys are recorded and unread.

benefit_year:
  start_month: 7                     # month the benefit year begins (July)
  income_year_offset: -1             # added to the benefit year to get the income year; negative means earlier

# --- Indexation -------------------------------------------------------------
# One entry per adjustment RULE, not per amount: applies_to lists every path
# that moves on it. The LENGTH of adjustment_months is what the engine uses,
# not which months they are; an empty list means the amount is fixed in
# nominal terms and erodes without bound. Two entries may carry the same
# adjustment_months: that is two rules that coincide this year, not one rule
# written twice, and keeping them apart is what lets one of them change
# without a code change. Keyed by the name
# engine.core.indexation.schedule(name, params) is called with.

# OAS is guaranteed never to decrease. Under constant real modelling the rule has no effect and is not coded (L24).

indexation:
  # pension and gis run on the same quarterly cadence today and are still two entries;
  # see the note above
  pension:
    adjustment_months: [1, 4, 7, 10]  # 4 entries = quarterly
    applies_to:
      - pension.age_bands.*.maximum_monthly
  recovery_tax_threshold:
    adjustment_months: [1]  # 1 entry = annual
    applies_to:
      - recovery_tax.threshold_annual
  gis:
    adjustment_months: [1, 4, 7, 10]  # 4 entries = quarterly
    applies_to:
      - gis.band_thresholds.single_testable_income_annual
      - gis.band_thresholds.couple_combined_testable_income_annual

# --- Start age and deferral -------------------------------------------------
# OAS may be deferred but never taken early: the factor is 1.0 at
# earliest_months and rises from there.

start_age:
  earliest_months: 780               # 65 * 12
  latest_months: 840                 # 70 * 12

deferral:
  increment_rate_per_month: 0.006    # 0.6% per month, i.e. 7.2%/yr, 36% at the 60-month maximum
  maximum_months: 60                 # months of deferral beyond which the factor stops rising

# --- Pension amount ---------------------------------------------------------
# The maximum steps up at an age threshold, which is why gross_pension_monthly
# takes current age as well as start age.

pension:
  age_bands:
    # Each band applies from from_age_months up to the next band's from_age_months.
    # The first band must start at start_age.earliest_months.
# 2026-09-04 https://www.canada.ca/en/services/benefits/publicpensions/old-age-security/benefit-amount.html
    - from_age_months: 780
      maximum_monthly: 751.97
    - from_age_months: 901      # 2026-09-13 Increase is in month *following* your 75th birthday
      maximum_monthly: 827.17

# --- Recovery tax (clawback) ------------------------------------------------
# Threshold and rate are ANNUAL quantities, read at the December close by
# engine/tax/combined.py::oas_repayment. Do not pre-divide: the repayment is
# assessed once on the year's net income and is never withheld from a monthly
# payment (L16, L23).
# 2026-09-04 https://www.canada.ca/en/services/benefits/publicpensions/old-age-security/recovery-tax.html

recovery_tax:
  threshold_annual: 95323            # net income above which recovery begins
  rate: 0.15                         # recovered per dollar of net income above the threshold

# --- GIS --------------------------------------------------------------------
# Read by engine/benefits/gis.py::in_band, an exposure indicator, not a GIS calculation (L2). Non-taxable, and reduced against a different
# income base than the recovery tax uses — the testable basis is combined
# across a couple and is not net income.

gis:
  modelled: false
  # Not a GIS calculation. These bound the reporting band: the engine reports
  # the fraction of path-years in which a living pensioner's projected
  # testable income sits inside them, so a plan leaning on unmodelled GIS is
  # visible rather than silent (L2). Set BELOW the published cutoffs on
  # purpose — erring low widens the band, which is the safe direction.
  band_thresholds:
    single_testable_income_annual: 22800
    couple_combined_testable_income_annual: 42144

# --- NOT HERE ---------------------------------------------------------------
# Full OAS requires 40 years of residence after 18; 10 years gets a partial pension at 1/40th per year of residence.
# The maximum_monthly assumes 40+. There's also a 20-year rule for non-residents.
# As with CPP, the engine does not model residence history, so these rules are not expressed here.
