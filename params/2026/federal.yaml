# Federal income tax parameters — tax year 2026
#
# Conventions for this file:
#   - Every value carries an inline comment with its source URL and the date
#     it was checked.
#   - Every group of values carries a source comment directly above it: the
#     primary source URL and the date a human checked it. That comment is the
#     audit record — there is no separate ledger to keep in step with it.
#   - Say the period in the key name. Never convert between periods here; write
#     the amount as published and let the engine convert once.
#   - Dollar amounts end in _annual, _monthly, _lifetime, or _each.
#   - Rates are bare fractions (0.15), never percentages (15) or basis points.
#   - Dollar amounts are the nominal amounts as published for the tax year. The
#     engine works in real dollars and does the conversion; do not pre-deflate.
#
# SCOPE: income tax only. One federal program per file, so the registered
# account rules that used to sit here now live in rrif.yaml (RRSP/RRIF),
# tfsa.yaml, and resp.yaml.
#
# Read by: engine/benefits/employment.py (ei)
#          engine/core/timeline.py (is_filing_month)
#          engine/tax/combined.py (pension_splitting)
#          engine/tax/federal.py
#          engine/tax/provincial.py (non_refundable_credits)
#          engine/tax/withholding.py (ei)

# --- Calendar rules ---------------------------------------------------------
# Statutory, and parameters like any other: engine/core/timeline.py reads them
# rather than hard-coding a month.

# Note: if paying by installments, they are paid in March, June, September, and December.
# The engine does not model installments; it assumes a balance owing is paid in full in the filing month.
filing_month: 4                      # month a balance owing for the PRIOR tax year comes due

# --- Indexation -------------------------------------------------------------
# One entry per adjustment RULE, not per amount: applies_to lists every path
# that moves on it. The LENGTH of adjustment_months is what the engine uses,
# not which months they are; an empty list means the amount is fixed in
# nominal terms and erodes without bound. Two entries may carry the same
# adjustment_months: that is two rules that coincide this year, not one rule
# written twice, and keeping them apart is what lets one of them change
# without a code change. Keyed by the name
# engine.core.indexation.schedule(name, params) is called with.

# Verified pension income amount absent from 117.1 (2), which enumerates which amounts are indexed.
# 2026-09-06 https://laws-lois.justice.gc.ca/eng/acts/I-3.3/section-117.1.html
indexation:
  # Brackets and credits are indexed on the same schedule, so they share
  # one entry; split it if that ever stops being true.
  brackets_and_credits:
    adjustment_months: [1]           # 1 = annual
    applies_to:
      - brackets.edges_annual
      - credits.basic_personal_amount_annual
      - credits.age_amount.amount_annual
      - credits.age_amount.reduction_threshold_annual
      - contribution_credit.cpp_maximum_annual
      - contribution_credit.ei_maximum_annual
      - ei.maximum_insurable_earnings_annual
  unindexed:
    adjustment_months: []   # never adjusted; $2000 is fixed in the Act (unlike for Alberta)
    applies_to:
      - credits.pension_income_amount_annual

# --- Rate brackets ----------------------------------------------------------
# INVARIANT: len(rates) == len(edges_annual) + 1. Edges are the upper bound of
# each bracket except the last, which is unbounded. Edges strictly ascending.

# 2026-09-04 https://www.canada.ca/en/revenue-agency/services/tax/individuals/tax-rates-brackets/current-year.html
brackets:
  edges_annual: [58523, 117045, 181440, 258482]
  rates: [0.14, 0.205, 0.26, 0.29, 0.33]

# --- Non-refundable credits -------------------------------------------------
# Credit AMOUNTS are dollars of income; they reduce tax by amount * valuation
# rate.
#
# valuation_rate is kept separate from brackets.rates[0] on purpose. The two
# coincide today but are distinct legal rules and are not guaranteed to move in
# lockstep — either can change without the other. Enter it as its own value
# with its own source, even when it looks like a duplicate.

# 2026-09-04 https://www.canada.ca/en/revenue-agency/services/forms-publications/payroll/t4127-payroll-deductions-formulas.html
# 2026-09-04 https://www.taxtips.ca/nrcredits/tax-credits-2026.htm
credits:
  valuation_rate: 0.14
  basic_personal_amount_annual: 16452             # Note that there is a clawvback for high-income earners, but the engine does not model that.
  pension_income_amount_annual: 2000              # fixed at $2000 in the Income Tax Act, not indexed
  age_amount:
    eligibility_age_years: 65
    amount_annual: 9208
    reduction_threshold_annual: 46432
    reduction_rate: 0.15

# --- Credit for CPP and EI contributions ------------------------------------
# Read by engine/tax/federal.py::non_refundable_credits and
# engine/tax/provincial.py::non_refundable_credits.
#
# Not a fixed amount like the credits above: the credit is the contributions
# ACTUALLY PAID over the year, capped at these maxima and then valued at
# credits.valuation_rate (federally) or the province's rate. The amount paid is
# an argument to those functions, accumulated over the twelve monthly steps.
#
# The maxima live here, not in cpp.yaml, because they are Income Tax Act
# ceilings on a credit and apply Canada-wide. EI has no parameter file of its
# own: the premium rate and maximum insurable earnings sit in the ei block
# below, read by engine/benefits/employment.py::ei_premium_monthly.
#
# Contributions stop partway through the year once a ceiling is reached, so a
# year's figure is not twelve times a month's. Cap at the annual assessment,
# never per month.

# 2026-09-04 https://www.canada.ca/en/revenue-agency/services/tax/businesses/topics/payroll/payroll-deductions-contributions/canada-pension-plan-cpp/cpp-contribution-rates-maximums-exemptions.html
contribution_credit:
  cpp_maximum_annual: 3519.45
  ei_maximum_annual: 1123.07

# 2026-09-04 https://www.canada.ca/en/revenue-agency/services/tax/businesses/topics/payroll/payroll-deductions-contributions/employment-insurance-ei/ei-premium-rates-maximums.html
ei:
  premium_rate: 0.0163
  maximum_insurable_earnings_annual: 68900

# --- Investment income treatment -------------------------------------------
# Read by engine/tax/federal.py::total_income (gross-up and inclusion rate)
# and ::non_refundable_credits (dividend credit).
# These are federal income-tax rules, which is why they stay in this file
# rather than moving to an account file — the taxable account is not a
# registered program.

# 2026-09-04 https://laws-lois.justice.gc.ca/eng/acts/I-3.3/section-82.html
investment_income:
  capital_gains_inclusion_rate: 0.50
  eligible_dividend_gross_up_rate: 0.38           # s.82(1)(b)(ii)(D)
  # BASE: 6/11 of the GROSS-UP AMOUNT (the 0.38 above), not of the dividend
  # and not of the grossed-up dividend. Stated because the credit is quoted
  # both ways in secondary sources and the two differ by a factor of ~3.6.
  # engine/tax/federal.py::non_refundable_credits applies it on that base, as
  # engine/tax/provincial.py::non_refundable_credits does the ab.yaml
  # counterpart.
  eligible_dividend_credit_rate_of_gross_up: 0.54545454       # s.121(b)(iv) => (6/11), truncated

# Pension income

# DB pension at any age;
# RRIF and LIF withdrawals from the year the transferor is 65 at year end;
# never CPP, OAS, or RRSP lump sums.

# 2026-09-06 https://www.canada.ca/en/revenue-agency/services/tax/individuals/topics/pension-income-splitting.html
pension_splitting:
  maximum_transfer_share: 0.50

# 2026-09-06 https://www.canada.ca/en/revenue-agency/services/tax/individuals/topics/registered-retirement-income-fund-rrif/receiving-income-a-rrif.html
eligible_pension_income:
  rrif_minimum_age_years: 65
