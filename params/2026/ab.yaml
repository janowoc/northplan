# Alberta provincial income tax parameters — tax year 2026
#
# Conventions for this file:
#   - Every group of values carries a source comment directly above it: the
#     primary source URL and the date a human checked it against that source.
#     Individual values add their own note where the group comment is not
#     specific enough — a line number on a form, a subsection of an Act.
#     These comments ARE the audit record; there is no separate ledger.
#   - Say the period in the key name.
#   - Dollar amounts end in _annual, _monthly, _lifetime, or _each.
#   - Rates are bare fractions (0.15), never percentages or basis points.
#   - Nominal amounts as published; the engine deflates. Do not pre-deflate.
#
# Read by: engine/tax/provincial.py, engine/accounts/lira.py (LIF maximum),
#          engine/accounts/taxable.py (investment_income).
#
# Provincial credit amounts and the rate they are valued at are NOT derivable
# from the federal ones. Source them separately even where they look familiar.

# --- Indexation -------------------------------------------------------------
# One entry per adjustment RULE, not per amount: applies_to lists every path
# that moves on it. The LENGTH of adjustment_months is what the engine uses,
# not which months they are; an empty list means the amount is fixed in
# nominal terms and erodes without bound. Two entries may carry the same
# adjustment_months: that is two rules that coincide this year, not one rule
# written twice, and keeping them apart is what lets one of them change
# without a code change. Keyed by the name
# engine.core.indexation.schedule(name, params) is called with.

# Provincial indexation is its own rule and may differ from the federal one —
# a province can pause indexation for a year independently of Ottawa.

# Unlike in Federal, Alberta's pension amount is indexed.
# It is mentioned in 10(1) as $1719, then 44.2(1) calls out section 10 as indexed.
# 2026-09-06 https://www.canlii.org/en/ab/laws/stat/rsa-2000-c-a-30/latest/rsa-2000-c-a-30.html
indexation:
  brackets_and_credits:
    adjustment_months: [1]  # credits are adjusted annually
    applies_to:
      - brackets.edges_annual
      - credits.basic_personal_amount_annual
      - credits.pension_income_amount_annual
      - credits.age_amount.amount_annual
      - credits.age_amount.reduction_threshold_annual

# --- Rate brackets ----------------------------------------------------------
# INVARIANT: len(rates) == len(edges_annual) + 1, same as the federal file.
# A province with a single flat rate above the personal amount has an empty
# edges_annual list and one rate — that is a valid table, not a missing one.

# 2026-09-04 https://www.alberta.ca/personal-income-tax
# 2026-09-04 https://www.canada.ca/en/revenue-agency/services/tax/individuals/tax-rates-brackets/current-year.html
brackets:
  edges_annual: [61200, 154259, 185111, 246813, 370220]
  rates: [0.08, 0.10, 0.12, 0.13, 0.14, 0.15]

# --- Non-refundable credits -------------------------------------------------

# 2026-09-04 https://www.canada.ca/content/dam/cra-arc/formspubs/pub/t4127-jan/t4127-01-26e.pdf
credits:
  valuation_rate: 0.08                            # Line 53
  basic_personal_amount_annual: 22769             # Line 16
  pension_income_amount_annual: 1753              # Line 34
  age_amount:
    eligibility_age_years: 65                     # Line 17 — age at END of year
    amount_annual: 6345                           # Line 17
    reduction_threshold_annual: 47234             # Line 3 of Worksheet AB428
    reduction_rate: 0.15                          # Line 5 of Worksheet AB428

# --- Investment income treatment -------------------------------------------
# Read by engine/accounts/taxable.py::taxable_income_from_distributions.
# These are provincial income-tax rules, which is why they stay in this file
# rather than moving to an account file — the taxable account is not a
# registered program.

# 2026-09-06 https://www.canlii.org/en/ab/laws/stat/rsa-2000-c-a-30/latest/rsa-2000-c-a-30.html
investment_income:
  eligible_dividend_gross_up_rate: 0.38
  eligible_dividend_credit_rate_of_gross_up: 0.294805       # 21(c)(ii) => 227/770, truncated

# --- LIF maximum withdrawal -------------------------------------------------
# Read by engine/accounts/lira.py::maximum_withdrawal.
#
# ANNUAL, and the dangerous one. The maximum is fixed each January from the
# 1 January balance and consumed across the year. Enforced per month it would
# permit twelve times what the jurisdiction allows, and nothing in the output
# would look wrong.
#
# ---------------------------------------------------------------------------
# WHICH PROVINCE'S FILE THIS IS READ FROM IS NOT ALWAYS THIS HOUSEHOLD'S.
#
# A LIF is governed by the pension legislation of the jurisdiction the
# ORIGINATING PENSION was registered under, not by where the holder lives now.
# Someone resident in Alberta may hold an Ontario-registered LIF: they draw it
# under on.yaml's table and file Alberta income tax out of ab.yaml.
#
# So this block belongs in a province file — it is genuinely provincial law —
# but it is reached by a different route from the tax parameters above it:
#
#   income tax   ParamYear.province(HouseholdState.province)
#   LIF maximum  ParamYear.jurisdiction(LockedInState.jurisdiction)
#
# engine/core/state.py::LockedInState carries the registration jurisdiction,
# and PersonState.locked_in holds ONE of them per person. A person with two
# locked-in accounts from two employers in two jurisdictions is not modelled:
# the accounts do not merge in reality, and the model has a single slot for
# them. See docs/limitations.md L47.
#
# For a household that never moved the two lookups return this same file, which
# is why reading the LIF table out of the residence province is right until it
# is silently wrong.
#
# Federally regulated pensions are a jurisdiction of their own and have no file
# here. A household holding one stops the run rather than borrowing a
# province's table.
# ---------------------------------------------------------------------------

lif:
  # NOT EVERY JURISDICTION HAS A MAXIMUM. Some prescribe a RRIF-like account
  # with a minimum and no ceiling. That is a valid state, not a missing
  # parameter, and it has to be expressible — otherwise the loader's
  # MissingParameterError fires on a jurisdiction that simply has no such rule,
  # and the pressure is to invent one. Set `has_maximum: false` and omit the
  # table; leave `has_maximum` itself unset and the run stops, which is right.
  has_maximum: true                  # verified for Alberta

  # One row per age, 50..89, transcribed from the source table so that it can
  # be diffed against it line by line. terminal_age_years names the last row,
  # which applies to that age and every age above it. The first age must equal
  # unlocking_age_years below; both are 50.
  #
  # These factors are recomputed annually from the prescribed interest rate,
  # so this table belongs to 2026 and is re-sourced every year — it is not a
  # fixed statutory schedule that can be copied forward.
  maximum_factors:
    # Age at the START of the year -> factor applied to the 1 January balance.
# https://open.alberta.ca/publications/private-sector-pensions-interest-rate-tables-and-prescribed-amounts
# 2026-09-04 https://open.alberta.ca/dataset/f0c27086-6b12-4aa3-881a-b895498221fa/resource/613dd0f1-130b-41fb-a271-4b03b0750cf4/download/tbf-superintendent-of-pensions-interest-rate-tables-2026.pdf
    by_age:
      50: 0.0627
      51: 0.0631
      52: 0.0635
      53: 0.0640
      54: 0.0645
      55: 0.0651
      56: 0.0657
      57: 0.0663
      58: 0.0670
      59: 0.0677
      60: 0.0685
      61: 0.0694
      62: 0.0704
      63: 0.0714
      64: 0.0726
      65: 0.0738
      66: 0.0752
      67: 0.0767
      68: 0.0783
      69: 0.0802
      70: 0.0822
      71: 0.0845
      72: 0.0871
      73: 0.0900
      74: 0.0934
      75: 0.0971
      76: 0.1015
      77: 0.1066
      78: 0.1125
      79: 0.1196
      80: 0.1282
      81: 0.1387
      82: 0.1519
      83: 0.1690
      84: 0.1919
      85: 0.2240
      86: 0.2723
      87: 0.3529
      88: 0.5146
      89: 1.0000
    terminal_age_years: 89

  # Some jurisdictions define the maximum as the GREATER of the factor result
  # and the prior year's investment return. lira.maximum_withdrawal takes only
  # the opening balance and the age, so if this is true for Alberta the
  # signature is wrong. Verifying the flag is a lookup; changing the signature
  # is a design decision.
  maximum_is_greater_of_factor_and_prior_year_return: true

  # Unlocking. Withdrawals are barred before this age, which is what
  # distinguishes a LIRA from an RRSP.
# https://www.alberta.ca/pensions-individuals
# 2026-09-04 https://open.alberta.ca/dataset/3e08374c-ba38-4b96-abf0-6fd15dae7109/resource/c2419a4b-4a85-4453-91e8-4bb3ef51831b/download/tbf-accessing-pension-funds-information-for-individuals-2026.pdf
  unlocking_age_years: 50
