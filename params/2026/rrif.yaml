# RRSP and RRIF parameters — tax year 2026
#
# Conventions for this file:
#   - Every group of values carries a source comment directly above it: the
#     primary source URL and the date a human checked it against that source.
#     Individual values add their own note where the group comment is not
#     specific enough — a line number on a form, a subsection of an Act.
#     These comments ARE the audit record; there is no separate ledger.
#   - Rates and factors are bare fractions (0.0528), never percentages.
#   - Say the period in the key name.
#
# One file, because they are one program at two stages of life: the same money,
# accumulating under `rrsp:` and decumulating under `rrif:`, with the
# conversion rule joining them.
#
# Read by: engine/accounts/rrsp.py, engine/accounts/rrif.py

# --- Conversion -------------------------------------------------------------
# The join between the two halves of this file.

# 2026-09-03 https://www.canada.ca/en/revenue-agency/services/tax/individuals/topics/rrsps-related-plans/rrsp-options-when-you-turn-71/options-your-rrsps.html
# Note that no withdrawal is required in the year of conversion, but the RRIF must be set up by 31 December of that year.
# The engine will handle the timing of the first withdrawal.

conversion_age_years: 71             # RRSP must be a RRIF by 31 December of the year this age is reached (age at END of year)

# --- Accumulation: RRSP -----------------------------------------------------

# 2026-09-03 https://www.canada.ca/en/revenue-agency/services/tax/registered-plans-administrators/pspa/mp-rrsp-dpsp-tfsa-limits-ympe.html

rrsp:
  room:
    accrual_rate: 0.18               # fraction of prior-year earned income
    annual_dollar_limit: 33810       # cap on a single year's accrual

# Withholding on withdrawals is explicitly modelled: tax is remitted in the
# month of the withdrawal, while the liability is assessed at the December
# close and settled in federal.yaml's filing_month. TaxLedger carries the gap.
# Rates are banded by the size of the individual withdrawal.
# INVARIANT: len(rates) == len(edges) + 1, as in federal.yaml's brackets.
# The same rates apply to RRIF withdrawals above the minimum.

# 2026-09-03 https://www.canada.ca/en/revenue-agency/services/tax/individuals/topics/rrsps-related-plans/making-withdrawals/tax-rates-on-withdrawals.html
# These rates apply outside of Quebec.
withholding:
  edges: [5000, 15000]              # withdrawal amount band edges
  rates: [0.10, 0.20, 0.30]

# --- Decumulation: RRIF -----------------------------------------------------
#
# THE MINIMUM IS ANNUAL. minimum_factor is selected by age at the START of the
# year and applied to the balance on 1 JANUARY, before that year's growth. The
# product is the whole year's obligation, fixed in January and satisfied by
# 31 December. Nothing here is a monthly quantity; a per-month minimum equal to
# the annual one would withdraw twelve times too much.

rrif:
  minimum_factors:
    # Before the prescribed table begins, the factor is a formula rather than a
    # lookup: 1 / (formula_constant - age_at_start_of_year). The constant is a
    # number, so it lives here and not in the .py file.
    pre_table:
      formula_constant: 90           # the 'C' in 1 / (C - age)

    # Age at the START of the year -> factor. Keys are ages in whole years.
# 2026-09-03 https://www.canada.ca/en/revenue-agency/services/tax/businesses/topics/completing-slips-summaries/t4rsp-t4rif-information-returns/payments/chart-prescribed-factors.html
    by_age:
      71: 0.0528
      72: 0.0540
      73: 0.0553
      74: 0.0567
      75: 0.0582
      76: 0.0598
      77: 0.0617
      78: 0.0636
      79: 0.0658
      80: 0.0682
      81: 0.0708
      82: 0.0738
      83: 0.0771
      84: 0.0808
      85: 0.0851
      86: 0.0899
      87: 0.0955
      88: 0.1021
      89: 0.1099
      90: 0.1192
      91: 0.1306
      92: 0.1449
      93: 0.1634
      94: 0.1879
      95: 0.2000

    # The last row of the table applies to this age and every age above it.
    terminal_age_years: 95
