# Registered Education Savings Plan parameters — tax year 2026
#
# Conventions for this file:
#   - Every group of values carries a source comment directly above it: the
#     primary source URL and the date a human checked it against that source.
#     Individual values add their own note where the group comment is not
#     specific enough — a line number on a form, a subsection of an Act.
#     These comments ARE the audit record; there is no separate ledger.
#   - Say the period in the key name.
#   - Dollar amounts end in _annual, _monthly, _lifetime, or _each.
#   - Rates are bare fractions, never percentages or basis points.
#   - Nominal amounts as published; the engine deflates. Do not pre-deflate.
#
# EVERY LIMIT HERE IS PER BENEFICIARY. Grant room, the lifetime maximums, and
# the withdrawal window do not aggregate across children. Two children in one
# plan have two independent entitlements. Nothing in this file is a per-plan or
# per-household figure, and reading one as such is the error this program is
# most prone to.
#
# Read by: engine/accounts/resp.py

# --- Indexation -------------------------------------------------------------
# One entry per adjustment RULE, not per amount: applies_to lists every path
# that moves on it. The LENGTH of adjustment_months is what the engine uses,
# not which months they are; an empty list means the amount is fixed in
# nominal terms and erodes without bound. Two entries may carry the same
# adjustment_months: that is two rules that coincide this year, not one rule
# written twice, and keeping them apart is what lets one of them change
# without a code change. Keyed by the name
# engine.core.indexation.schedule(name, params) is called with.

indexation:
  enhanced_income_edges:
    adjustment_months: [1]          # adjusts annually
    applies_to:
      - grant.enhanced.income_edges_annual
  unindexed:
    adjustment_months: []   # never adjusted; most RESP limits are fixed
    applies_to:
      - contributions.maximum_lifetime
      - grant.room_annual
      - grant.maximum_annual
      - grant.maximum_lifetime
      - grant.enhanced.eligible_contribution_annual

# --- Contributions ----------------------------------------------------------

contributions:
  maximum_lifetime: 50000

# --- Grant ------------------------------------------------------------------
# Bounded four ways, and engine/accounts/resp.py::grant_on_contribution applies
# all four: the match rate, the annual room (which carries forward), the annual
# maximum measured against grant already received THIS CALENDAR YEAR, and the
# lifetime maximum. The annual maximum is the one the monthly timestep
# threatens — enforced per month, twelve monthly contributions each collect a
# full year's grant.

# 2026-09-06 https://www.canada.ca/en/revenue-agency/services/tax/individuals/topics/registered-education-savings-plans-resps/canada-education-savings-programs-cesp/canada-education-savings-grant-cesg.html
grant:
  match_rate: 0.20                  # grant per dollar contributed
  room_annual: 500                  # grant room accrued per beneficiary per year, in GRANT dollars
# 2026-09-19 https://www.canada.ca/en/employment-social-development/services/student-financial-aid/education-savings/resp/resp-promoters/user-guide/chapter-5.html#h2_5.3
  maximum_annual: 1000              # max BASIC grant per beneficiary per CALENDAR YEAR, including room carried
                                    # forward; the additional tier is paid over and above it. Table 5 of Section 5.3.
  cessation_age_years: 17           # age at which the grant stops accruing, and the annual room is no longer added
  maximum_lifetime: 7200            # max grant per beneficiary, all years —
                                    # covers the basic and enhanced tiers
                                    # COMBINED, which is why resp.py carries a
                                    # single lifetime_grant_paid rather than
                                    # one per tier

  # --- Additional (income-tested) grant tier --------------------------------
  # Read by engine/accounts/resp.py::enhanced_grant_rate and
  # ::grant_on_contribution.
  #
  # Paid ON TOP OF match_rate above, and only on the first
  # eligible_contribution_annual dollars contributed in the calendar year. Two
  # limits, not three:
  #
  #   match_rates                    a percentage, stepped by family income
  #   eligible_contribution_annual   a dollar window the percentage applies to
  #
  # THERE IS DELIBERATELY NO maximum_annual HERE, unlike the basic grant above.
  # The enhanced tier has no carry-forward: the window is this year's first
  # eligible_contribution_annual dollars and nothing accumulates, so the cap is
  # exactly match_rate * eligible_contribution_annual and a separate key would
  # be a second source of truth for one fact.
  #
  # The basic grant above is the opposite case and that is why it has the key:
  # room_annual and maximum_annual are BOTH grant dollars, and maximum_annual
  # (1000) is not room_annual (500), precisely because unused basic room
  # carries forward and one year can pay out more than one year's accrual.
  # Do not read the two blocks as parallel.
  #
  # grant_on_contribution must NOT compute the enhanced cap from a literal —
  # it falls out of rate * min(contribution, remaining eligible window), with
  # no constant in the .py file.
  enhanced:
    # Income cut-offs, laid out like a bracket table.
    # INVARIANT: len(match_rates) == len(income_edges_annual) + 1.
    # These are CLIFFS, not a phase-out: a dollar of income across a cut-off
    # changes the rate on every eligible dollar. Rates DESCEND as income rises,
    # which is the opposite direction from a tax bracket table — check the
    # ordering when you enter them.

    # https://www.canada.ca/en/employment-social-development/services/student-financial-aid/education-savings/resp/resp-promoters/bulletin/notice-2025-1114.html
    income_edges_annual: [58523, 117045]     # ascending
    match_rates: [0.20, 0.10, 0.00]          # descending; last entry applies above the highest cut-off and may be zero

    eligible_contribution_annual: 500        # first dollars each year the enhanced rate applies to

    # Which calendar year's family income governs the rate. Added to the
    # current year, so -2 means "year before last's income". Statutory, and read
    # rather than assumed: guessing the current year overstates the grant for
    # a household whose income is rising and understates it for one drawing
    # down. The reach-back is the RESP's own rule — the OAS repayment does not
    # reach back, it is assessed on the current year (L23).
    # Section 5.2.8 of the "Registered Education Savings Plan provider user guide"
    # says it's two years back.
# 2026-09-19 https://www.canada.ca/en/employment-social-development/services/student-financial-aid/education-savings/resp/resp-promoters/user-guide/chapter-5.html#h2_5.2
    income_year_offset: -2

    # Whose income counts. The rate is set by FAMILY income, not the
    # subscriber's — a grandparent subscriber does not make a low-income family
    # a high-income one. The model has one household, so this is a note rather
    # than a key; revisit if a subscriber outside the household is ever
    # modelled.

# --- Accumulated Income Payments ---------------------------------------

# The AIP is when there is no longer a student and the plan is paid out.
# The grant portion is clawed back. The contribution is withdrawn tax-free.
# The growth portion is taxable to the subscriber, and the AIP penalty is a
# further 20% on top of that.

# 2026-09-06 https://www.canada.ca/en/revenue-agency/services/tax/individuals/topics/registered-education-savings-plans-resps/payments-resp.html#aip
aip:
  penalty_rate: 0.20                   # 20% penalty on the growth portion of the RESP
