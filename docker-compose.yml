services:
  northplan:
    build: .
    # Bound to loopback: this serves a household's complete financial position
    # and has no authentication. Do not change to 0.0.0.0 without adding some.
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      # Hand-edited parameters take effect on restart, without a rebuild.
      - ./params:/app/params:ro
      # The example scenario, served at /api/example. There is no database.
      - ./scenarios:/app/scenarios
    restart: unless-stopped
