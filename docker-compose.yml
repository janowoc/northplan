services:
  northplan:
    build: .
    # Bound to loopback, so only this machine can connect. The container sees
    # every connection as coming from another machine, so the browser asks for
    # the token the server writes to its log (see README). To serve other
    # devices, drop the 127.0.0.1: prefix; the traffic is plain HTTP.
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      # Hand-edited parameters take effect on the next request, without a
      # rebuild; the editor's calls keep the ones they have loaded until a
      # restart.
      - ./params:/app/params:ro
      # The example and minimal scenarios, served at /api/example and
      # /api/minimal. There is no database.
      - ./scenarios:/app/scenarios
    restart: unless-stopped
